name: Validate website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate-site.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate variable index
        run: node scripts/validate-site.mjs
