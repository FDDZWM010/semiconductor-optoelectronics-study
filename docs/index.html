<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="《半导体光电子学（第3版）》按章节整理的变量、定义、单位、关系式与页码索引。">
  <title>半导体光电子学 · 变量导航</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%2308172d'/%3E%3Cpath d='M12 19h17l7 8h16M12 45h17l7-8h16' fill='none' stroke='%2368e4ff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M32 17v30' stroke='%23ffbe55' stroke-width='3' stroke-dasharray='4 4'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --bg-2: #0a1728;
      --panel: #0d1b2f;
      --panel-2: #10223a;
      --line: #203752;
      --line-2: #2c4b6c;
      --text: #eef7ff;
      --muted: #98aec4;
      --soft: #c6d5e3;
      --cyan: #68e4ff;
      --cyan-2: #1fb9db;
      --amber: #ffbe55;
      --violet: #9c91ff;
      --red: #ff788a;
      --green: #6ee7b7;
      --shadow: 0 24px 64px rgba(0, 0, 0, .25);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 82% -10%, rgba(31,185,219,.12), transparent 31rem),
        linear-gradient(180deg, #07111f 0%, #081523 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .skip-link {
      position: fixed; left: 1rem; top: -5rem; z-index: 100;
      padding: .65rem 1rem; background: var(--cyan); color: #04101e; border-radius: 8px;
    }
    .skip-link:focus { top: 1rem; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      min-height: 72px;
      display: grid; grid-template-columns: minmax(240px, 360px) minmax(280px, 720px) auto;
      align-items: center; gap: 1rem;
      padding: .75rem clamp(1rem, 2.4vw, 2rem);
      background: rgba(7,17,31,.88);
      border-bottom: 1px solid rgba(104,228,255,.16);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: .78rem; min-width: 0; }
    .brand-mark {
      width: 42px; height: 42px; flex: 0 0 auto; border: 1px solid var(--line-2); border-radius: 11px;
      display: grid; place-items: center; background: linear-gradient(145deg,#102a46,#09172a); box-shadow: inset 0 0 22px rgba(104,228,255,.07);
    }
    .brand-mark svg { width: 30px; height: 30px; }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 1rem; line-height: 1.25; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-copy span { display: block; color: var(--muted); font-size: .78rem; line-height: 1.3; }

    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: .95rem; top: 50%; transform: translateY(-50%); color: var(--cyan); pointer-events: none; }
    #searchInput {
      width: 100%; height: 48px; padding: 0 7.8rem 0 2.8rem;
      color: var(--text); background: #0b1b2e; border: 1px solid var(--line-2); border-radius: 12px; outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }
    #searchInput::placeholder { color: #7690a8; }
    #searchInput:focus { border-color: var(--cyan-2); box-shadow: 0 0 0 3px rgba(31,185,219,.13); }
    .search-scope {
      position: absolute; right: .42rem; top: 50%; transform: translateY(-50%);
      border: 1px solid var(--line); background: #10243a; color: var(--soft); border-radius: 8px;
      min-width: 6.7rem; height: 36px; padding: 0 .7rem; cursor: pointer; font-size: .82rem;
    }
    .top-actions { display: flex; align-items: center; gap: .55rem; }
    .icon-button, .ghost-button {
      border: 1px solid var(--line); background: var(--panel); border-radius: 10px; cursor: pointer;
      min-height: 42px; padding: .55rem .8rem;
    }
    .icon-button { display: none; width: 42px; padding: 0; place-items: center; }
    .ghost-button:hover, .icon-button:hover { border-color: var(--cyan-2); background: var(--panel-2); }
    .kbd { border: 1px solid var(--line); border-bottom-color: #3d5d7e; background: #0a1728; color: var(--muted); border-radius: 5px; padding: .04rem .35rem; font-size: .74rem; }

    .app-layout {
      display: grid; grid-template-columns: 286px minmax(0, 1fr);
      min-height: calc(100vh - 72px);
    }
    .sidebar {
      position: sticky; top: 72px; align-self: start; height: calc(100vh - 72px); overflow-y: auto;
      border-right: 1px solid var(--line); background: rgba(8,21,35,.72);
      padding: 1.2rem .85rem 2rem;
      scrollbar-color: var(--line-2) transparent;
    }
    .side-label { padding: 0 .65rem .55rem; color: #6f8ba7; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; }
    .chapter-nav { display: grid; gap: .32rem; }
    .chapter-button {
      width: 100%; display: grid; grid-template-columns: 2.1rem minmax(0,1fr) auto; align-items: center; gap: .55rem;
      text-align: left; border: 1px solid transparent; background: transparent; color: var(--soft); border-radius: 10px;
      padding: .62rem .62rem; cursor: pointer;
    }
    .chapter-button:hover { background: rgba(104,228,255,.055); border-color: rgba(104,228,255,.12); }
    .chapter-button[aria-current="page"] { background: linear-gradient(90deg, rgba(31,185,219,.15), rgba(31,185,219,.035)); border-color: rgba(104,228,255,.27); color: white; }
    .chapter-number {
      width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 8px;
      background: #0a1829; border: 1px solid var(--line); color: var(--cyan); font-size: .78rem; font-weight: 700;
    }
    .chapter-title { min-width: 0; }
    .chapter-title strong { display: block; font-size: .88rem; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chapter-title small { color: var(--muted); font-size: .73rem; }
    .chapter-count { color: #7891a9; font-variant-numeric: tabular-nums; font-size: .74rem; }
    .sidebar-note { margin: 1.25rem .55rem 0; padding: .85rem; color: var(--muted); background: rgba(16,34,58,.58); border: 1px solid var(--line); border-radius: 11px; font-size: .78rem; }
    .sidebar-note strong { color: var(--soft); }

    main { min-width: 0; padding: clamp(1.2rem, 3vw, 2.5rem); }
    .chapter-header {
      position: relative; overflow: hidden;
      display: grid; grid-template-columns: minmax(0,1fr) minmax(250px, 360px); gap: 2rem; align-items: end;
      border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(135deg, #10243a 0%, #0b1a2d 58%, #0b2137 100%);
      padding: clamp(1.25rem, 3vw, 2.1rem); box-shadow: var(--shadow);
    }
    .chapter-header::after {
      content: ""; position: absolute; inset: auto -8rem -12rem auto; width: 24rem; height: 24rem; border-radius: 50%;
      background: radial-gradient(circle, rgba(104,228,255,.13), transparent 68%); pointer-events: none;
    }
    .eyebrow { margin: 0 0 .4rem; color: var(--cyan); font-size: .78rem; letter-spacing: .13em; text-transform: uppercase; }
    .chapter-header h1 { margin: 0; max-width: 860px; font-size: clamp(1.65rem, 3vw, 2.5rem); line-height: 1.22; letter-spacing: -.025em; }
    .chapter-summary { max-width: 780px; margin: .8rem 0 0; color: var(--soft); }
    .page-range { display: inline-flex; align-items: center; gap: .5rem; margin-top: 1rem; color: var(--muted); font-size: .83rem; }
    .page-range::before { content: ""; width: 1.4rem; height: 1px; background: var(--amber); }

    .band-map { position: relative; z-index: 1; border-left: 1px solid var(--line-2); padding-left: 1.5rem; }
    .band-map svg { width: 100%; height: 118px; display: block; }
    .band-map-caption { display: flex; justify-content: space-between; color: var(--muted); font-size: .74rem; }
    .stats-row { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1rem; }
    .stat-chip { border: 1px solid var(--line); background: rgba(6,17,31,.45); border-radius: 999px; padding: .3rem .62rem; color: var(--soft); font-size: .78rem; }
    .stat-chip b { color: var(--cyan); }

    .chains {
      display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: .7rem; margin: 1rem 0 0;
    }
    .chain-button {
      min-width: 0; text-align: left; border: 1px solid var(--line); background: rgba(13,27,47,.72); border-radius: 11px;
      padding: .8rem .9rem; cursor: pointer;
    }
    .chain-button:hover { border-color: var(--cyan-2); transform: translateY(-1px); }
    .chain-button span { display: block; color: var(--cyan); font-family: "Cambria Math", "STIX Two Math", serif; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chain-button small { color: var(--muted); }

    .workspace-bar {
      position: sticky; top: 72px; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      margin: 1.15rem 0 .8rem; padding: .75rem .1rem;
      background: linear-gradient(180deg, rgba(7,17,31,.97) 70%, rgba(7,17,31,0));
    }
    .results-copy { color: var(--soft); font-size: .9rem; }
    .results-copy b { color: var(--cyan); font-variant-numeric: tabular-nums; }
    .filter-row { display: flex; align-items: center; gap: .45rem; overflow-x: auto; padding: .1rem; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-button {
      flex: 0 0 auto; border: 1px solid var(--line); background: #0b192b; color: var(--muted); border-radius: 999px;
      padding: .42rem .75rem; cursor: pointer; font-size: .8rem;
    }
    .filter-button:hover, .filter-button[aria-pressed="true"] { border-color: var(--cyan-2); color: white; background: rgba(31,185,219,.13); }
    .filter-button.conflict[aria-pressed="true"] { border-color: var(--amber); background: rgba(255,190,85,.12); }

    .section-jump { display: flex; gap: .45rem; overflow-x: auto; margin: 0 0 1rem; padding-bottom: .25rem; scrollbar-color: var(--line) transparent; }
    .section-jump button { flex: 0 0 auto; border: 0; border-bottom: 1px solid var(--line-2); background: transparent; color: var(--muted); padding: .35rem .15rem; cursor: pointer; font-size: .8rem; }
    .section-jump button:hover { color: var(--cyan); border-color: var(--cyan); }

    .variable-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: .85rem; }
    .variable-card {
      scroll-margin-top: 150px;
      display: flex; flex-direction: column; min-width: 0;
      border: 1px solid var(--line); background: linear-gradient(155deg, rgba(15,32,54,.98), rgba(10,24,41,.98));
      border-radius: var(--radius); overflow: hidden;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .variable-card:hover { transform: translateY(-2px); border-color: #356181; box-shadow: 0 14px 28px rgba(0,0,0,.18); }
    .card-top { display: grid; grid-template-columns: minmax(72px,auto) minmax(0,1fr); gap: 1rem; padding: 1rem 1rem .72rem; }
    .symbol {
      align-self: start; min-width: 72px; min-height: 54px; display: grid; place-items: center;
      padding: .45rem .6rem; border: 1px solid rgba(104,228,255,.2); border-radius: 10px;
      background: rgba(104,228,255,.055); color: #bdf4ff;
      font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 1.3rem; line-height: 1.2; text-align: center;
    }
    .symbol sub, .symbol sup { font-size: .65em; }
    .variable-title { min-width: 0; }
    .variable-title h2 { margin: 0; font-size: 1rem; line-height: 1.35; }
    .variable-title p { margin: .2rem 0 0; color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .badges { display: flex; flex-wrap: wrap; gap: .34rem; margin-top: .45rem; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: .12rem .44rem; color: #9fb5c9; font-size: .68rem; line-height: 1.45; }
    .badge.ambiguous { border-color: rgba(255,190,85,.35); background: rgba(255,190,85,.08); color: #ffd993; }
    .definition { margin: 0; padding: 0 1rem .9rem; color: var(--soft); font-size: .9rem; }
    .relation { margin: 0 1rem .85rem; padding: .62rem .75rem; border-left: 2px solid var(--cyan-2); background: rgba(4,15,28,.5); color: #d9f6ff; font-family: "Cambria Math", "STIX Two Math", serif; font-size: .88rem; overflow-wrap: anywhere; }
    .card-footer { margin-top: auto; display: flex; justify-content: space-between; gap: .65rem; border-top: 1px solid rgba(44,75,108,.55); padding: .66rem 1rem; color: var(--muted); font-size: .74rem; }
    .location { color: #a9bfd2; }
    .unit { text-align: right; }
    .variable-card mark { background: rgba(255,190,85,.22); color: #fff2cf; border-radius: 3px; padding: 0 .08em; }

    .empty-state { display: none; text-align: center; border: 1px dashed var(--line-2); border-radius: 15px; padding: 3rem 1rem; color: var(--muted); }
    .empty-state strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: .35rem; }
    .empty-state button { margin-top: .85rem; border: 1px solid var(--line-2); background: var(--panel); color: var(--cyan); border-radius: 9px; padding: .5rem .8rem; cursor: pointer; }
    .source-note { margin: 1.3rem 0 0; padding: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
    .source-note b { color: var(--soft); }
    .drawer-scrim { display: none; position: fixed; inset: 72px 0 0; z-index: 29; background: rgba(0,0,0,.55); }
    .toast { position: fixed; right: 1.2rem; bottom: 1.2rem; z-index: 80; padding: .65rem .9rem; border: 1px solid var(--line-2); background: #10243a; color: var(--text); border-radius: 9px; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s ease; font-size: .85rem; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1040px) {
      .topbar { grid-template-columns: auto minmax(260px,1fr) auto; }
      .brand-copy span { display: none; }
      .app-layout { grid-template-columns: 240px minmax(0,1fr); }
      .chains { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .chapter-header { grid-template-columns: 1fr; }
      .band-map { display: none; }
    }
    @media (max-width: 760px) {
      .topbar { grid-template-columns: auto minmax(0,1fr) auto; padding: .65rem .75rem; }
      .brand-copy { display: none; }
      .top-actions .ghost-button { display: none; }
      .icon-button { display: grid; }
      #searchInput { padding-right: 2.7rem; }
      .search-scope { width: 34px; min-width: 34px; overflow: hidden; color: transparent; padding: 0; }
      .search-scope::after { content: "全"; color: var(--cyan); position: absolute; inset: 0; display: grid; place-items: center; }
      .search-scope[data-scope="chapter"]::after { content: "章"; }
      .app-layout { display: block; }
      .sidebar { position: fixed; z-index: 30; top: 72px; left: 0; width: min(88vw, 310px); transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--shadow); }
      body.nav-open .sidebar { transform: translateX(0); }
      body.nav-open .drawer-scrim { display: block; }
      main { padding: 1rem .85rem 2rem; }
      .chapter-header { border-radius: 14px; padding: 1.15rem; }
      .chapter-header h1 { font-size: 1.55rem; }
      .chains { grid-template-columns: 1fr 1fr; }
      .workspace-bar { top: 72px; align-items: flex-start; flex-direction: column; gap: .55rem; padding-top: .65rem; }
      .filter-row { width: 100%; }
      .variable-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 430px) {
      .chains { grid-template-columns: 1fr; }
      .card-top { grid-template-columns: 68px minmax(0,1fr); gap: .75rem; }
      .symbol { min-width: 68px; font-size: 1.15rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">跳到变量列表</a>
  <header class="topbar">
    <div class="brand" aria-label="半导体光电子学变量导航">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M4 10h12l5 6h15M4 30h12l5-6h15" fill="none" stroke="#68e4ff" stroke-width="2.5" stroke-linecap="round"/><path d="M20 7v26" stroke="#ffbe55" stroke-width="2" stroke-dasharray="3 3"/></svg>
      </div>
      <div class="brand-copy"><strong>半导体光电子学 · 变量导航</strong><span>第 3 版 · 章节索引与全书搜索</span></div>
    </div>
    <div class="search-wrap" role="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false" aria-label="搜索全书变量" placeholder="搜符号、中文、英文、公式或章节，例如 Eg / 量子效率 / APD">
      <button id="scopeButton" class="search-scope" type="button" data-scope="all" aria-label="切换搜索范围">全书搜索</button>
    </div>
    <div class="top-actions">
      <button id="menuButton" class="icon-button" type="button" aria-label="打开章节导航" aria-expanded="false">☰</button>
      <button id="focusSearch" class="ghost-button" type="button">快速搜索 <span class="kbd">/</span></button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar" aria-label="章节导航">
      <div class="side-label">Book map</div>
      <nav id="chapterNav" class="chapter-nav"></nav>
      <div class="sidebar-note"><strong>页码说明</strong><br>卡片中的“书 P”是印刷页码；扫描 PDF 前置页共 11 页，因此 PDF 页码 = 书页 + 11。</div>
    </aside>

    <main id="mainContent" tabindex="-1">
      <section id="chapterHeader" class="chapter-header" aria-labelledby="chapterTitle"></section>
      <section class="chains" aria-label="常用关系链">
        <button class="chain-button" data-chain="jng"><span>J → n → g</span><small>电流到材料增益</small></button>
        <button class="chain-button" data-chain="eglambda"><span>E<sub>g</sub> ↔ hν ↔ λ</span><small>带隙与发光波长</small></button>
        <button class="chain-button" data-chain="waveguide"><span>n<sub>eff</sub> → β → mode</span><small>波导与模式</small></button>
        <button class="chain-button" data-chain="responsivity"><span>η → ℜ</span><small>量子效率到响应度</small></button>
      </section>

      <section class="workspace-bar" aria-label="结果筛选">
        <div id="resultsCopy" class="results-copy" aria-live="polite"></div>
        <div id="filterRow" class="filter-row"></div>
      </section>
      <nav id="sectionJump" class="section-jump" aria-label="本章小节"></nav>
      <section id="variableGrid" class="variable-grid" aria-label="变量列表"></section>
      <section id="emptyState" class="empty-state">
        <strong>没有找到匹配变量</strong>
        <span>可以改搜中文含义、英文名称或不带下标的符号。</span><br>
        <button id="clearSearch" type="button">清除搜索</button>
      </section>
      <footer class="source-note"><b>整理依据：</b>《半导体光电子学（第 3 版）》目录、正文变量首次定义与主要关系式。变量按本书语境归并；同一符号在不同章节含义不同时保留为独立条目并标注“一符多义”。</footer>
    </main>
  </div>
  <div id="drawerScrim" class="drawer-scrim" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const CHAPTERS = [
      {id:"all", short:"总", title:"全书总览", range:"印刷页 1–310", pdf:"PDF 12–321", summary:"跨章节检索变量、定义、单位和主要关系式；输入符号、中文名称、英文名称或器件缩写均可。"},
      {id:"common", short:"常", title:"全书常用量与常数", range:"贯穿全书", pdf:"", summary:"跨章节反复使用的基本常数、光子量和电磁量。各章中的专用含义仍在对应章节单独列出。"},
      {id:"1", short:"01", title:"半导体中光子–电子的相互作用", range:"印刷页 4–43", pdf:"PDF 15–54", summary:"从能带跃迁、态密度和占据几率出发，建立自发发射、受激发射、吸收、复合以及增益与电流密度之间的关系。"},

      if (state.conflictOnly && !hasConflict(v)) return false;
      return true;
    }
    function textMatches(v) {
      const tokens = normalize(state.query).split(" ").filter(Boolean);
      return tokens.every(t => v._search.includes(t));
    }
    function visibleVariables() {
      const candidates = VARIABLES.filter(inBaseScope);
      if (state.chain && CHAINS[state.chain]) return candidates.filter(CHAINS[state.chain].test);
      if (!state.query) return candidates;
      const compact = normalize(state.query).replace(/\s+/g,"");
      if (/^[a-z0-9]+$/.test(compact) && compact.length >= 2 && compact.length <= 8) {
        const exact = candidates.filter(v => v._exact.some(x => x === compact || x.startsWith(compact)));
        if (exact.length) return exact;
      }
      return candidates.filter(textMatches);
    }
    function esc(value) { return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
    function highlight(text) {
      if (!state.query) return esc(text);
      const rawTokens = state.query.trim().split(/\s+/).filter(t => t.length > 1).slice(0,4);
      let safe = esc(text);
      rawTokens.forEach(token => {
        const clean = esc(token).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
        if (clean) safe = safe.replace(new RegExp(`(${clean})`,`ig`),"<mark>$1</mark>");
      });
      return safe;
    }
    function locationLabel(v) {
      if (!v.page) return v.section;
      return `§${v.section} · 书 P${v.page} · PDF P${v.page+11}`;
    }
    function conflictLabel(v) {
      const key = Object.keys(AMBIGUOUS).find(k => strip(v.symbol).includes(k));
      return key ? `${key}：${AMBIGUOUS[key]}` : (v.conflict || "同一符号在书中另有含义");
    }

    function renderNav() {
      chapterNav.innerHTML = CHAPTERS.map(c => {
        const count = chapterVariables(c.id).length;
        return `<button class="chapter-button" type="button" data-chapter="${c.id}" ${c.id===state.chapter?'aria-current="page"':''}>
          <span class="chapter-number">${c.short}</span><span class="chapter-title"><strong>${c.title}</strong><small>${c.range}</small></span><span class="chapter-count">${count}</span>
        </button>`;
      }).join("");
    }

    function renderHeader() {
      const c = currentChapter();
      const count = chapterVariables(c.id).length;
      const sections = new Set(chapterVariables(c.id).map(v=>v.section)).size;
      chapterHeader.innerHTML = `<div>
        <p class="eyebrow">${c.id === "all" ? "VARIABLE ATLAS" : c.id === "common" ? "COMMON SYMBOLS" : c.id.length===1 || c.id.length===2 ? `CHAPTER ${c.id}` : `APPENDIX ${c.id}`}</p>
        <h1 id="chapterTitle">${c.title}</h1>
        <p class="chapter-summary">${c.summary}</p>
        <div class="page-range">${c.range}${c.pdf ? ` · ${c.pdf}` : ""}</div>
        <div class="stats-row"><span class="stat-chip"><b>${count}</b> 张变量卡</span><span class="stat-chip"><b>${sections}</b> 个定位小节</span><span class="stat-chip">全库 <b>${VARIABLES.length}</b> 张</span></div>
      </div>
      <div class="band-map" aria-hidden="true">
        <svg viewBox="0 0 340 118">
          <defs><linearGradient id="beam" x1="0" x2="1"><stop stop-color="#ffbe55"/><stop offset="1" stop-color="#ff788a"/></linearGradient></defs>
          <path d="M12 26 C76 20 112 31 164 24 S263 15 328 24" fill="none" stroke="#68e4ff" stroke-width="3"/>
          <path d="M12 90 C76 96 112 84 164 92 S263 100 328 92" fill="none" stroke="#9c91ff" stroke-width="3"/>
          <path d="M170 80V40" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
          <path d="M164 47l6-10 6 10" fill="none" stroke="#ffbe55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="18" y="17" fill="#98aec4" font-size="12">Eᶜ / guided state</text><text x="18" y="112" fill="#98aec4" font-size="12">Eᵛ / lower state</text><text x="185" y="64" fill="#ffcf7c" font-size="12">hν</text>
        </svg>
        <div class="band-map-caption"><span>能量 / 模式</span><span>关系式索引</span></div>
      </div>`;
    }

    function visibleTags() {
      const pool = state.chapter === "all" ? VARIABLES : chapterVariables(state.chapter);
      const counts = {};
      pool.forEach(v => v.tags.forEach(t => counts[t]=(counts[t]||0)+1));
      return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,7).map(x=>x[0]);
    }
    function renderFilters() {
      const tags = visibleTags();
      if (state.tag !== "全部" && !tags.includes(state.tag)) state.tag="全部";
      filterRow.innerHTML = ["全部",...tags].map(tag => `<button class="filter-button" type="button" data-tag="${tag}" aria-pressed="${state.tag===tag}">${tag}</button>`).join("") +
        `<button class="filter-button conflict" type="button" data-conflict="true" aria-pressed="${state.conflictOnly}">一符多义</button>`;
    }
    function renderSections(list) {
      if (state.query || state.chapter === "all") { sectionJump.innerHTML=""; return; }
      const sections = [...new Set(list.map(v=>v.section))];
      sectionJump.innerHTML = sections.map(s=>`<button type="button" data-section="${s}">§ ${s}</button>`).join("");
    }
    function renderCards() {
      const list = visibleVariables();
      const c = currentChapter();
      const scopeText = state.query ? (state.scope === "all" || state.chapter === "all" ? "全书" : c.title) : c.title;
      resultsCopy.innerHTML = `${scopeText} · 找到 <b>${list.length}</b> 个变量${state.query ? `，关键词“${esc(state.query)}”` : ""}`;
      renderSections(list);
      variableGrid.innerHTML = list.map(v => {
        const ambiguous = hasConflict(v);
        const chapter = CHAPTERS.find(c=>c.id===v.chapter);
        return `<article class="variable-card" id="var-${v._i}" data-section="${v.section}">
          <div class="card-top"><div class="symbol">${v.symbol}</div><div class="variable-title">
            <h2>${highlight(v.name)}</h2><p>${highlight(v.english)}</p>
            <div class="badges">${v.tags.slice(0,3).map(t=>`<span class="badge">${t}</span>`).join("")}${ambiguous?`<span class="badge ambiguous" title="${esc(conflictLabel(v))}">一符多义</span>`:""}</div>
          </div></div>
          <p class="definition">${highlight(v.definition)}${v.note?` <span title="补充说明">${highlight(v.note)}</span>`:""}</p>
          ${v.relation?`<div class="relation">${v.relation}</div>`:""}
          <div class="card-footer"><span class="location">${chapter && state.chapter==="all" ? `${chapter.short} · ` : ""}${locationLabel(v)}</span><span class="unit">${esc(v.unit||"无量纲")}</span></div>
        </article>`;
      }).join("");
      emptyState.style.display = list.length ? "none" : "block";
      variableGrid.style.display = list.length ? "grid" : "none";
    }
    function renderAll({scroll=false}={}) {
      renderNav(); renderHeader(); renderFilters(); renderCards();
      scopeButton.dataset.scope=state.scope;
      scopeButton.textContent=state.scope==="all"?"全书搜索":"当前章节";
      if (scroll) document.querySelector("#mainContent").scrollIntoView({behavior:"smooth",block:"start"});
      updateHash();
    }
    function updateHash() {
      const params = new URLSearchParams();
      params.set("chapter",state.chapter);
      if (state.query) params.set("q",strip(state.query));
      if (state.chain) params.set("chain",state.chain);
      if (state.scope!=="all") params.set("scope",state.scope);
      history.replaceState(null,"",`#${params.toString()}`);
    }
    function readHash() {
      const raw = location.hash.slice(1); if (!raw) return;
      const params = new URLSearchParams(raw);
      const chapter=params.get("chapter"); if (CHAPTERS.some(c=>c.id===chapter)) state.chapter=chapter;
      state.chain=CHAINS[params.get("chain")] ? params.get("chain") : "";
      state.query=state.chain ? CHAINS[state.chain].label : (params.get("q")||""); searchInput.value=strip(state.query);
      if (params.get("scope")==="chapter") state.scope="chapter";
    }
    function showToast(message) {
      toast.textContent=message; toast.classList.add("show");
      clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>toast.classList.remove("show"),1800);
    }
    function closeNav() { document.body.classList.remove("nav-open"); document.querySelector("#menuButton").setAttribute("aria-expanded","false"); }

    chapterNav.addEventListener("click", e => {
      const b=e.target.closest("[data-chapter]"); if(!b) return;
      state.chapter=b.dataset.chapter; state.tag="全部"; state.conflictOnly=false;
      renderAll({scroll:true}); closeNav();
    });
    let searchTimer;
    searchInput.addEventListener("input", e => {
      clearTimeout(searchTimer); searchTimer=setTimeout(()=>{state.chain=""; state.query=e.target.value.trim(); state.tag="全部"; renderFilters(); renderCards(); updateHash();},90);
    });
    scopeButton.addEventListener("click",()=>{state.scope=state.scope==="all"?"chapter":"all"; renderAll(); showToast(state.scope==="all"?"搜索范围：全书":"搜索范围：当前章节");});
    filterRow.addEventListener("click",e=>{
      const tag=e.target.closest("[data-tag]"); const conflict=e.target.closest("[data-conflict]");
      if(tag){state.tag=tag.dataset.tag;} if(conflict){state.conflictOnly=!state.conflictOnly;}
      renderFilters(); renderCards();
    });
    sectionJump.addEventListener("click",e=>{
      const b=e.target.closest("[data-section]"); if(!b) return;
      const target=variableGrid.querySelector(`[data-section="${CSS.escape(b.dataset.section)}"]`); if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
    });
    document.querySelectorAll("[data-chain]").forEach(b=>b.addEventListener("click",()=>{state.chain=b.dataset.chain; state.query=CHAINS[state.chain].label; searchInput.value=strip(state.query); state.scope="all"; state.tag="全部"; renderAll(); searchInput.focus();}));
    document.querySelector("#clearSearch").addEventListener("click",()=>{state.chain=""; state.query=""; searchInput.value=""; state.tag="全部"; state.conflictOnly=false; renderAll(); searchInput.focus();});
    document.querySelector("#focusSearch").addEventListener("click",()=>searchInput.focus());
    document.querySelector("#menuButton").addEventListener("click",e=>{const open=document.body.classList.toggle("nav-open"); e.currentTarget.setAttribute("aria-expanded",String(open));});
    document.querySelector("#drawerScrim").addEventListener("click",closeNav);
    document.addEventListener("keydown",e=>{
      if(e.key==="/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();searchInput.focus();}
      if(e.key==="Escape"){ if(document.activeElement===searchInput && searchInput.value){searchInput.value="";state.chain="";state.query="";renderAll();} else {closeNav();searchInput.blur();} }
    });
    window.addEventListener("hashchange",()=>{readHash();renderAll();});

    readHash();
    renderAll();
  </script>
</body>
</html>
